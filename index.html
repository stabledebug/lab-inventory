<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1890ff">
<title>课题组耗材管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --blue: #1890ff;
    --green: #52c41a;
    --orange: #fa8c16;
    --red: #ff4d4f;
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #333;
    --muted: #999;
    --border: #f0f0f0;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e9e9e9;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 500px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); box-shadow: 0 0 24px rgba(0,0,0,0.06); }

  header {
    background: var(--blue);
    color: #fff;
    padding: 14px 16px;
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  main { flex: 1; overflow-y: auto; padding-bottom: 64px; -webkit-overflow-scrolling: touch; }
  .view { display: none; }
  .view.active { display: block; }

  .section { background: var(--card); margin: 12px 16px; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
  .section-title { font-size: 15px; font-weight: 600; color: var(--text); padding: 16px; border-bottom: 1px solid var(--border); }
  .section-title.red { color: var(--red); }

  .search-bar { background: #fff; padding: 12px 16px; }
  .search-input {
    width: 100%; background: var(--bg); border: none; border-radius: 20px;
    padding: 0 14px; height: 40px; font-size: 14px; color: var(--text); outline: none;
  }
  .filter-tabs { background: #fff; padding: 0 16px; display: flex; border-bottom: 1px solid var(--border); }
  .tab { font-size: 14px; color: #666; padding: 12px; position: relative; cursor: pointer; }
  .tab.active { color: var(--blue); font-weight: 600; }
  .tab.active::after {
    content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 28px; height: 3px; background: var(--blue); border-radius: 2px;
  }

  .record-list { padding: 12px 16px; }
  .record-card {
    background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06); cursor: pointer;
  }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .record-name { font-size: 16px; font-weight: 600; flex: 1; margin-right: 10px; word-break: break-all; }
  .badge { font-size: 12px; padding: 3px 8px; border-radius: 12px; white-space: nowrap; }
  .badge.in { background: #e6f7ff; color: var(--blue); border: 1px solid #91d5ff; }
  .badge.out { background: var(--bg); color: var(--muted); border: 1px solid #d9d9d9; }
  .info-row { display: flex; align-items: center; padding: 4px 0; }
  .label { font-size: 12px; color: var(--muted); min-width: 80px; flex-shrink: 0; }
  .value { font-size: 13px; color: var(--text); flex: 1; word-break: break-all; }
  .value.danger { color: var(--red); }
  .value.price { color: var(--blue); font-weight: 600; }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 20px; }
  .empty .icon { font-size: 48px; display: block; margin-bottom: 12px; }

  .form-section { margin: 12px 16px; background: #fff; border-radius: 12px; padding: 4px 16px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
  .field { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .field:last-child { border-bottom: none; }
  .field-label { font-size: 13px; color: var(--text); margin-bottom: 8px; font-weight: 500; }
  .field-label.required::before { content: '* '; color: var(--red); }
  .field-input, .field-select, .field-textarea {
    width: 100%; border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px;
    font-size: 14px; color: var(--text); background: #fafafa; outline: none; font-family: inherit;
  }
  .field-textarea { resize: vertical; min-height: 64px; }
  .row2 { display: flex; gap: 12px; }
  .row2 > .field { flex: 1; }
  .submit-btn {
    margin: 16px; background: var(--blue); color: #fff; border: none; border-radius: 23px;
    height: 46px; font-size: 16px; font-weight: 600; width: calc(100% - 32px); cursor: pointer;
  }
  .submit-btn:active { opacity: 0.85; }

  .overview-row { display: flex; padding: 16px 16px 8px; gap: 12px; }
  .stat-card { flex: 1; border-radius: 12px; padding: 16px 8px 14px; text-align: center; box-shadow: 0 1px 10px rgba(0,0,0,0.08); }
  .stat-card.blue { background: var(--blue); }
  .stat-card.green { background: var(--green); }
  .stat-card.orange { background: var(--orange); }
  .stat-num { display: block; font-size: 26px; font-weight: 700; color: #fff; line-height: 1; margin-bottom: 6px; }
  .stat-lbl { display: block; font-size: 11px; color: rgba(255,255,255,0.85); }

  .amount-row { display: flex; align-items: center; padding: 14px 16px; }
  .amount-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .amount-divider { width: 1px; height: 44px; background: var(--border); }
  .amount-lbl { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .amount-cny { font-size: 18px; font-weight: 700; color: var(--blue); line-height: 1.2; }
  .amount-usd { font-size: 13px; color: var(--orange); margin-top: 2px; }

  .trend-chart { display: flex; align-items: flex-end; justify-content: space-around; padding: 16px 12px 8px; height: 140px; }
  .trend-col { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
  .trend-bar-wrap { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .trend-bar { width: 24px; background: var(--blue); border-radius: 3px 3px 0 0; min-height: 3px; transition: height .3s; }
  .trend-count { font-size: 11px; color: var(--blue); font-weight: 600; margin-bottom: 4px; }
  .trend-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .recent-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f9f9f9; }
  .recent-item:last-child { border-bottom: none; }
  .recent-name { font-size: 14px; color: var(--text); font-weight: 500; display: block; margin-bottom: 4px; word-break: break-all; }
  .recent-date { font-size: 11px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-left: 12px; flex-shrink: 0; }
  .dot.in { background: var(--green); }
  .dot.out { background: #ddd; }

  .export-tip { font-size: 12px; color: var(--muted); padding: 14px 16px 8px; line-height: 1.6; }
  .export-btn { margin: 0 16px 16px; background: var(--blue); color: #fff; border: none; border-radius: 22px; height: 44px; font-size: 15px; font-weight: 600; width: calc(100% - 32px); cursor: pointer; }
  .export-btn:active { opacity: 0.85; }

  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 500px; height: 56px; background: #fff;
    display: flex; border-top: 1px solid var(--border); z-index: 20;
  }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 11px; }
  .nav-item.active { color: var(--blue); }
  .nav-icon { font-size: 22px; margin-bottom: 2px; }

  .mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
  .mask.show { display: flex; }
  .sheet {
    background: #fff; width: 100%; max-width: 500px; border-radius: 16px 16px 0 0;
    max-height: 88vh; overflow-y: auto; padding-bottom: 24px; animation: up .25s ease;
  }
  @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #fff; z-index: 1; }
  .sheet-title { font-size: 16px; font-weight: 600; }
  .sheet-close { font-size: 24px; color: var(--muted); cursor: pointer; line-height: 1; }
  .sheet-body { padding: 6px 16px; }
  .sheet-actions { display: flex; gap: 12px; padding: 12px 16px 0; }
  .btn { flex: 1; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.danger { background: #fff2f0; color: var(--red); border: 1px solid #ffccc7; }
  .btn.plain { background: #f5f5f5; color: #666; }
  .btn:active { opacity: 0.85; }

  @media (min-width: 540px) {
    .record-name { font-size: 17px; }
    .stat-num { font-size: 28px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>课题组耗材管理</header>
  <main>
    <!-- 记录 -->
    <section class="view active" id="view-records">
      <div class="search-bar">
        <input class="search-input" id="searchInput" placeholder="搜索货物名称 / 采购人 / 卖方公司">
      </div>
      <div class="filter-tabs">
        <div class="tab active" data-filter="all">全部</div>
        <div class="tab" data-filter="in_stock">库存中</div>
        <div class="tab" data-filter="out_stock">已出库</div>
      </div>
      <div class="record-list" id="recordList"></div>
    </section>

    <!-- 入库 -->
    <section class="view" id="view-add">
      <form id="addForm">
        <div class="form-section">
          <div class="field">
            <div class="field-label required">采购货物名称</div>
            <input class="field-input" id="f-name" placeholder="如：移液枪枪头">
          </div>
          <div class="field">
            <div class="field-label required">规格</div>
            <input class="field-input" id="f-spec" placeholder="如：10mL/支、500g/瓶">
          </div>
          <div class="row2">
            <div class="field">
              <div class="field-label required">数量</div>
              <input class="field-input" id="f-quantity" type="number" inputmode="decimal" placeholder="数量">
            </div>
            <div class="field">
              <div class="field-label">单位</div>
              <select class="field-select" id="f-unit">
                <option>件</option><option>盒</option><option>瓶</option><option>支</option><option>个</option>
                <option>包</option><option>箱</option><option>卷</option><option>袋</option><option>张</option>
                <option>米</option><option>kg</option><option>g</option><option>L</option><option>mL</option>
              </select>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <div class="field-label required">金额</div>
              <input class="field-input" id="f-amount" type="number" inputmode="decimal" placeholder="0.00">
            </div>
            <div class="field">
              <div class="field-label required">币种</div>
              <select class="field-select" id="f-currency">
                <option value="CNY">人民币 ¥</option>
                <option value="USD">美元 $</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-section">
          <div class="field">
            <div class="field-label required">入库日期</div>
            <input class="field-input" id="f-inDate" type="date">
          </div>
          <div class="field">
            <div class="field-label required">采购人</div>
            <input class="field-input" id="f-purchaser" placeholder="采购人姓名">
          </div>
          <div class="field">
            <div class="field-label required">采购理由</div>
            <input class="field-input" id="f-reason" placeholder="如：PCR 实验耗材补充">
          </div>
          <div class="field">
            <div class="field-label required">卖方公司名称</div>
            <input class="field-input" id="f-seller" placeholder="如：某某生物科技有限公司">
          </div>
          <div class="field">
            <div class="field-label">备注</div>
            <textarea class="field-textarea" id="f-remark" placeholder="其他备注（选填）"></textarea>
          </div>
        </div>
        <button type="submit" class="submit-btn">确认入库</button>
      </form>
    </section>

    <!-- 统计 -->
    <section class="view" id="view-stats">
      <div class="overview-row">
        <div class="stat-card blue"><span class="stat-num" id="s-total">0</span><span class="stat-lbl">总记录</span></div>
        <div class="stat-card green"><span class="stat-num" id="s-in">0</span><span class="stat-lbl">库存中</span></div>
        <div class="stat-card orange"><span class="stat-num" id="s-out">0</span><span class="stat-lbl">已出库</span></div>
      </div>
      <div class="section">
        <div class="section-title">金额统计</div>
        <div class="amount-row">
          <div class="amount-col">
            <span class="amount-lbl">库存金额</span>
            <span class="amount-cny" id="s-stockCny">¥0.00</span>
            <span class="amount-usd" id="s-stockUsd">$0.00</span>
          </div>
          <div class="amount-divider"></div>
          <div class="amount-col">
            <span class="amount-lbl">累计入库金额</span>
            <span class="amount-cny" id="s-inCny">¥0.00</span>
            <span class="amount-usd" id="s-inUsd">$0.00</span>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-title" id="s-month-title">本月统计</div>
        <div class="amount-row">
          <div class="amount-col">
            <span class="amount-lbl">本月入库</span>
            <span class="stat-num" style="color:var(--blue);font-size:22px" id="s-monthIn">0</span>
          </div>
          <div class="amount-divider"></div>
          <div class="amount-col">
            <span class="amount-lbl">本月出库</span>
            <span class="stat-num" style="color:var(--orange);font-size:22px" id="s-monthOut">0</span>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">近6月入库趋势</div>
        <div class="trend-chart" id="trendChart"></div>
      </div>
      <div class="section">
        <div class="section-title">最近入库</div>
        <div id="recentList"></div>
      </div>
      <div class="section">
        <div class="section-title">数据导入导出</div>
        <div class="export-tip">导出 CSV 可在 Excel / WPS 打开编辑；导入同样格式的 CSV 可批量恢复或合并数据。数据已保存在 GitHub 仓库云端，课题组共享同一份。</div>
        <div style="display:flex; gap:12px; padding:0 16px 16px;">
          <button class="export-btn" id="exportBtn" style="margin:0;flex:1">导出表格</button>
          <button class="export-btn" id="importBtn" style="margin:0;flex:1;background:#fff;color:var(--blue);border:1px solid var(--blue)">导入表格</button>
        </div>
        <div style="padding:0 16px 16px;">
          <button class="export-btn" id="tokenBtn" style="margin:0;width:100%;background:#fff;color:var(--muted);border:1px solid #ddd">更改访问令牌</button>
        </div>
        <input type="file" id="importFile" accept=".csv" style="display:none">
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-item active" data-view="records"><span class="nav-icon">📋</span>记录</div>
    <div class="nav-item" data-view="add"><span class="nav-icon">➕</span>入库</div>
    <div class="nav-item" data-view="stats"><span class="nav-icon">📊</span>统计</div>
  </nav>

  <div class="mask" id="mask">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
/* ===== GitHub 云端同步（方案 B）=====
   数据存在仓库的 inventory.json，所有人共享同一份。
   令牌首次打开时粘贴，仅存本机浏览器（localStorage），不写入仓库源码，
   以免触发 GitHub 密钥扫描拦截推送 / 自动撤销令牌。 */
const REPO = 'stabledebug/lab-inventory';
const FILE = 'inventory.json';

let DB = [];

function getToken() { return localStorage.getItem('lab_gh_token') || ''; }
function ensureToken() {
  const t = getToken();
  if (t) return Promise.resolve(t);
  return new Promise(resolve => {
    const sheet = document.getElementById('sheet');
    sheet.innerHTML = `<div class="sheet-head"><span class="sheet-title">设置访问令牌</span><span class="sheet-close" onclick="closeSheet()">×</span></div>
      <div class="sheet-body" style="padding:16px">
        <p style="font-size:13px;color:#666;line-height:1.6;margin-bottom:12px">数据保存在 GitHub 仓库，需粘贴一个 <b>Fine-grained PAT</b>（仅授权 lab-inventory 仓库 Contents 读写）才能读写。令牌只存在本机浏览器，不会上传。</p>
        <input class="field-input" id="tokInput" placeholder="粘贴 github_pat_... 令牌" style="margin-bottom:16px">
        <button class="btn primary" id="tokSave">保存并使用</button>
      </div>`;
    document.getElementById('mask').classList.add('show');
    document.getElementById('tokSave').onclick = () => {
      const v = document.getElementById('tokInput').value.trim();
      if (!v) { toast('请输入令牌'); return; }
      localStorage.setItem('lab_gh_token', v);
      document.getElementById('mask').classList.remove('show');
      resolve(v);
    };
  });
}

async function apiGet() {
  const tk = await ensureToken();
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
    headers: { Authorization: `Bearer ${tk}`, Accept: 'application/vnd.github+json' }
  });
  if (r.status === 404) return { sha: null, data: [] };
  if (!r.ok) throw new Error('读取失败 ' + r.status);
  const j = await r.json();
  const txt = decodeURIComponent(escape(atob(j.content.replace(/\s/g, ''))));
  return { sha: j.sha, data: JSON.parse(txt) };
}
async function apiPut(data, sha) {
  const tk = await ensureToken();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = { message: 'update inventory ' + new Date().toISOString(), content };
  if (sha) body.sha = sha;
  return fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${tk}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
}
function mergeArrays(remote, local) {
  const m = new Map();
  (remote || []).forEach(r => m.set(r.id, r));
  (local || []).forEach(r => m.set(r.id, r));
  return Array.from(m.values());
}
async function ensureFresh() {
  try {
    const { data } = await apiGet();
    DB = Array.isArray(data) ? data : [];
    try { localStorage.setItem('lab_cache', JSON.stringify(DB)); } catch (e) {}
  } catch (e) { /* 保留内存中的数据 */ }
}
async function push() {
  for (let i = 0; i < 6; i++) {
    const { sha, data: remote } = await apiGet();
    const merged = mergeArrays(remote, DB);
    const res = await apiPut(merged, sha);
    if (res.ok) {
      DB = merged;
      try { localStorage.setItem('lab_cache', JSON.stringify(DB)); } catch (e) {}
      return;
    }
    if (res.status === 409) continue; // 别人刚改了，拉最新重试
    throw new Error('保存失败(' + res.status + ')');
  }
  throw new Error('并发冲突，请稍后重试');
}

const UNITS = ['件','盒','瓶','支','个','包','箱','卷','袋','张','米','kg','g','L','mL'];
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function sym(c) { return c === 'USD' ? '$' : '¥'; }
function fmtPrice(p, c) {
  if (p === '' || p === undefined || p === null || isNaN(parseFloat(p))) return '-';
  return sym(c) + parseFloat(p).toFixed(2);
}
function esc(s) {
  return String(s === undefined ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let state = { search: '', filter: 'all' };

async function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === name));
  if (name === 'records') { await ensureFresh(); renderRecords(); }
  if (name === 'stats') { await ensureFresh(); renderStats(); }
}
document.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => showView(n.dataset.view)));
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  state.filter = t.dataset.filter;
  renderRecords();
}));
document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value.trim().toLowerCase(); renderRecords(); });

function getFiltered() {
  let list = DB;
  if (state.search) {
    list = list.filter(r =>
      (r.name||'').toLowerCase().includes(state.search) ||
      (r.purchaser||'').toLowerCase().includes(state.search) ||
      (r.seller||'').toLowerCase().includes(state.search));
  }
  if (state.filter === 'in_stock') list = list.filter(r => !r.outDate);
  else if (state.filter === 'out_stock') list = list.filter(r => !!r.outDate);
  list = list.slice().sort((a,b) => new Date(b.inDate) - new Date(a.inDate));
  return list;
}
function renderRecords() {
  const list = getFiltered();
  const box = document.getElementById('recordList');
  if (!list.length) {
    box.innerHTML = `<div class="empty"><span class="icon">📦</span>暂无记录<br>去「入库」添加第一条吧</div>`;
    return;
  }
  box.innerHTML = list.map(r => `
    <div class="record-card" onclick="openDetail('${r.id}')">
      <div class="card-header">
        <span class="record-name">${esc(r.name)}</span>
        <span class="badge ${r.outDate ? 'out' : 'in'}">${r.outDate ? '已出库' : '库存中'}</span>
      </div>
      <div class="info-row"><span class="label">入库日期</span><span class="value">${esc(r.inDate)}</span></div>
      <div class="info-row"><span class="label">采购人</span><span class="value">${esc(r.purchaser) || '-'}</span></div>
      <div class="info-row"><span class="label">卖方公司</span><span class="value">${esc(r.seller) || '-'}</span></div>
      ${r.quantity ? `<div class="info-row"><span class="label">数量</span><span class="value">${esc(r.quantity)} ${esc(r.unit||'件')}</span></div>` : ''}
      ${r.spec ? `<div class="info-row"><span class="label">规格</span><span class="value">${esc(r.spec)}</span></div>` : ''}
      <div class="info-row"><span class="label">金额</span><span class="value price">${fmtPrice(r.amount, r.currency)}</span></div>
    </div>`).join('');
}

      <span class="sheet-title">${esc(r.name)}</span>
      <span class="sheet-close" onclick="closeSheet()">×</span>

    <div class="sheet-body">
      <div class="section" style="margin:12px 0;box-shadow:none;border:1px solid var(--border)">
        <div class="section-title">基本信息</div>
        <div class="info-row"><span class="label">货物名称</span><span class="value">${esc(r.name)}</span></div>
        ${r.spec ? `<div class="info-row"><span class="label">规格</span><span class="value">${esc(r.spec)}</span></div>` : ''}
        ${r.quantity ? `<div class="info-row"><span class="label">数量</span><span class="value">${esc(r.quantity)} ${esc(r.unit||'件')}</span></div>` : ''}
        <div class="info-row"><span class="label">金额</span><span class="value price">${fmtPrice(r.amount, r.currency)}</span></div>
      </div>
      <div class="section" style="margin:12px 0;box-shadow:none;border:1px solid var(--border)">
        <div class="section-title">入库信息</div>

        <div class="info-row"><span class="label">采购人</span><span class="value">${esc(r.purchaser) || '-'}</span></div>

        ${r.outPrice ? `<div class="info-row"><span class="label">出库金额</span><span class="value danger">${fmtPrice(r.outPrice, r.outCurrency)}</span></div>` : ''}
      </div>` : `

        <div class="field"><div class="field-label required">出库日期</div><input class="field-input" id="o-date" type="date" value="${today()}"></div>

        <div class="field"><div class="field-label required">领用数量</div><input class="field-input" id="o-quantity" type="number" inputmode="decimal" placeholder="本次领用数量"></div>

            <select class="field-select" id="o-currency">
              <option value="CNY" ${r.outCurrency!=='USD'?'selected':''}>人民币 ¥</option>

            </select>
          </div>
        </div>
        <div class="field"><div class="field-label">出库备注</div><textarea class="field-textarea" id="o-remark" placeholder="选填">${esc(r.outRemark||'')}</textarea></div>
      </div>`}

    <div class="sheet-actions">

      <button class="btn plain" onclick="editRecord('${r.id}')">编辑</button>
      <button class="btn danger" onclick="delRecord('${r.id}')">删除</button>
    </div>`;
  document.getElementById('mask').classList.add('show');
}
function closeSheet() { document.getElementById('mask').classList.remove('show'); }
document.getElementById('mask').addEventListener('click', e => { if (e.target.id === 'mask') closeSheet(); });

async function confirmOut(id) {
  const outDate = document.getElementById('o-date').value;
  const outReceiver = document.getElementById('o-receiver').value.trim();
  const outReason = document.getElementById('o-reason').value.trim();
  const outQuantity = document.getElementById('o-quantity').value;
  if (!outDate) { toast('请填写出库日期'); return; }
  if (!outReceiver) { toast('请填写领用人'); return; }
  if (!outReason) { toast('请填写领用原因'); return; }
  if (!outQuantity) { toast('请填写领用数量'); return; }
  await ensureFresh();
  const r = DB.find(x => x.id === id);
  if (!r) return;
  r.outDate = outDate;
  r.outReceiver = outReceiver;
  r.outReason = outReason;
  r.outQuantity = outQuantity;
  r.outPrice = document.getElementById('o-price').value;
  r.outCurrency = document.getElementById('o-currency').value;
  r.outRemark = document.getElementById('o-remark').value.trim();
  try { await push(); closeSheet(); renderRecords(); toast('出库成功'); }
  catch (e) { toast(e.message); }
}

async function delRecord(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  await ensureFresh();
  DB = DB.filter(x => x.id !== id);
  try { await push(); closeSheet(); renderRecords(); toast('已删除'); }
  catch (e) { toast(e.message); }
}

async function saveEdit(id) {
  const name = document.getElementById('e-name').value.trim();
  const spec = document.getElementById('e-spec').value.trim();
  const quantity = document.getElementById('e-quantity').value;
  const amount = document.getElementById('e-amount').value;
  const inDate = document.getElementById('e-inDate').value;
  const purchaser = document.getElementById('e-purchaser').value.trim();
  const reason = document.getElementById('e-reason').value.trim();
  const seller = document.getElementById('e-seller').value.trim();
  if (!name) { toast('请填写货物名称'); return; }
  if (!spec) { toast('请填写规格'); return; }
  if (!quantity) { toast('请填写数量'); return; }
  if (!amount) { toast('请填写金额'); return; }
  if (!inDate) { toast('请填写入库日期'); return; }
  if (!purchaser) { toast('请填写采购人'); return; }
  if (!reason) { toast('请填写采购理由'); return; }
  if (!seller) { toast('请填写卖方公司名称'); return; }
  await ensureFresh();
  const r = DB.find(x => x.id === id);
  if (!r) return;
  r.name = name; r.spec = spec; r.quantity = quantity; r.unit = document.getElementById('e-unit').value;
  r.amount = amount; r.currency = document.getElementById('e-currency').value; r.inDate = inDate;
  r.purchaser = purchaser; r.reason = reason; r.seller = seller;
  r.remark = document.getElementById('e-remark').value.trim();
  try { await push(); openDetail(id); renderRecords(); toast('已保存'); }
  catch (e) { toast(e.message); }
}

function renderStats() {
  const list = DB;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  const thisMonth = `${y}-${String(m).padStart(2,'0')}`;
  const total = list.length;
  const inStock = list.filter(r => !r.outDate).length;
  const outStock = list.filter(r => !!r.outDate).length;
  const monthIn = list.filter(r => r.inDate && r.inDate.startsWith(thisMonth)).length;
  const monthOut = list.filter(r => r.outDate && r.outDate.startsWith(thisMonth)).length;

  let stockCny = 0, stockUsd = 0, inCny = 0, inUsd = 0;
  list.forEach(r => {
    const p = parseFloat(r.amount);
    if (!isNaN(p)) {
      if (r.currency === 'USD') inUsd += p; else inCny += p;
      if (!r.outDate) { if (r.currency === 'USD') stockUsd += p; else stockCny += p; }
    }
  });

  document.getElementById('s-total').textContent = total;
  document.getElementById('s-in').textContent = inStock;
  document.getElementById('s-out').textContent = outStock;
  document.getElementById('s-stockCny').textContent = '¥' + stockCny.toFixed(2);
  document.getElementById('s-stockUsd').textContent = '$' + stockUsd.toFixed(2);
  document.getElementById('s-inCny').textContent = '¥' + inCny.toFixed(2);
  document.getElementById('s-inUsd').textContent = '$' + inUsd.toFixed(2);
  document.getElementById('s-month-title').textContent = m + '月统计';
  document.getElementById('s-monthIn').textContent = monthIn;
  document.getElementById('s-monthOut').textContent = monthOut;

  const trend = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(y, m - 1 - i, 1);
    const ms = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    trend.push({ label: (d.getMonth()+1) + '月', count: list.filter(r => r.inDate && r.inDate.startsWith(ms)).length });
  }
  const max = Math.max(1, ...trend.map(t => t.count));
  document.getElementById('trendChart').innerHTML = trend.map(t => `
    <div class="trend-col">
      <div class="trend-bar-wrap">
        <span class="trend-count">${t.count || ''}</span>
        <div class="trend-bar" style="height:${Math.round(t.count / max * 96)}px"></div>
      </div>
      <span class="trend-label">${t.label}</span>
    </div>`).join('');

  const recent = list.slice().sort((a,b) => new Date(b.inDate) - new Date(a.inDate)).slice(0, 5);
  document.getElementById('recentList').innerHTML = recent.length
    ? recent.map(r => `
      <div class="recent-item" onclick="openDetail('${r.id}')">
        <div><span class="recent-name">${esc(r.name)}</span><span class="recent-date">${esc(r.inDate)} · ${esc(r.purchaser) || '—'}</span></div>
        <span class="dot ${r.outDate ? 'out' : 'in'}"></span>
      </div>`).join('')
    : `<div class="empty" style="padding:40px">暂无入库记录</div>`;
}

document.getElementById('exportBtn').addEventListener('click', () => {
  if (!DB.length) { toast('暂无数据可导出'); return; }
  const header = ['货物名称','规格','数量','单位','入库日期','采购人','采购理由','金额','币种','卖方公司','入库备注','出库日期','领用人','领用原因','领用数量','出库金额','出库币种','出库备注','状态'];
  const rows = DB.map(r => [
    r.name, r.spec||'', r.quantity||'', r.unit||'', r.inDate, r.purchaser||'', r.reason||'',
    r.amount||'', r.currency==='USD'?'美元':'人民币', r.seller||'', r.remark||'',
    r.outDate||'', r.outReceiver||'', r.outReason||'', r.outQuantity||'',
    r.outPrice||'', r.outCurrency==='USD'?'美元':'人民币', r.outRemark||'',
    r.outDate ? '已出库' : '库存中'
  ]);
  const csv = [header, ...rows].map(row => row.map(c => {
    const s = String(c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `课题组耗材_${today()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 CSV 文件');
});

document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('tokenBtn').addEventListener('click', () => {
  localStorage.removeItem('lab_gh_token');
  ensureToken().then(() => { toast('令牌已更新'); showView('records'); });
});
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const text = String(reader.result).replace(/^\uFEFF/, '');
      const rows = parseCSV(text);
      if (rows.length < 2) { toast('文件无数据'); e.target.value = ''; return; }
      const dataRows = rows.slice(1).map(mapCsvRow).filter(r => r.name);
      if (!dataRows.length) { toast('未解析到有效记录'); e.target.value = ''; return; }
      await ensureFresh();
      let target;
      if (DB.length) {
        const overwrite = confirm('现有数据 ' + DB.length + ' 条：\n确定 = 覆盖\n取消 = 追加');
        target = overwrite ? dataRows : DB.concat(dataRows);
      } else {
        target = dataRows;
      }
      DB = target;
      await push();
      toast('已导入 ' + dataRows.length + ' 条');
      showView('records');
    } catch (err) {
      toast('导入失败：格式错误');
    }
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
});

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function mapCsvRow(c) {
  const cur = s => /美/.test(s || '') ? 'USD' : 'CNY';
  return {
    id: Date.now().toString() + Math.floor(Math.random() * 1000),
    name: (c[0] || '').trim(),
    spec: (c[1] || '').trim(),
    quantity: (c[2] || '').trim(),
    unit: (c[3] || '').trim(),
    inDate: (c[4] || '').trim(),
    purchaser: (c[5] || '').trim(),
    reason: (c[6] || '').trim(),
    amount: (c[7] || '').trim(),
    currency: cur(c[8]),
    seller: (c[9] || '').trim(),
    remark: (c[10] || '').trim(),
    outDate: (c[11] || '').trim(),
    outReceiver: (c[12] || '').trim(),
    outReason: (c[13] || '').trim(),
    outQuantity: (c[14] || '').trim(),
    outPrice: (c[15] || '').trim(),
    outCurrency: cur(c[16]),
    outRemark: (c[17] || '').trim(),
    createdAt: new Date().toISOString(),
  };
}

let toastTimer;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999;pointer-events:none;transition:opacity .2s'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.opacity = '0', 1500);
}

document.getElementById('f-inDate').value = today();
(async function init() {
  try {
    const { data } = await apiGet();
    DB = Array.isArray(data) ? data : [];
    try { localStorage.setItem('lab_cache', JSON.stringify(DB)); } catch (e) {}
  } catch (e) {
    try { DB = JSON.parse(localStorage.getItem('lab_cache') || '[]'); } catch (e) { DB = []; }
    toast('云端加载失败，显示本地缓存');
  }
  renderRecords();
})();
</script>
